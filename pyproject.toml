[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-deployment-patterns"
version = "1.0.0"
description = "Production deployment patterns for agentic AI systems"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nachiketh Murthy" }]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
dev = ["pytest>=8", "ruff>=0.4", "fastapi>=0.110", "httpx>=0.27",
       "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 66
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
