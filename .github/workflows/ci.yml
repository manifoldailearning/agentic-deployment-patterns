name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests
        run: pytest -q
      - name: Evaluation gate
        env:
          PYTHONPATH: src:examples
        run: >
          python -m adp.evals evals/cases.jsonl
          support_system:build_system
          --baseline evals/baseline.json
          --report eval-report.json
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.12'
        with:
          name: eval-report
          path: eval-report.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agent-service:ci .
      - name: Smoke test
        run: |
          docker run -d --name svc -p 8000:8000 agent-service:ci
          for i in $(seq 1 30); do
            curl -fs localhost:8000/readyz && break; sleep 1
          done
          curl -fs -X POST localhost:8000/v1/ask \
            -H 'content-type: application/json' \
            -d '{"text": "Where is order ORD-100001?"}' \
            | grep -q shipped
          docker rm -f svc
